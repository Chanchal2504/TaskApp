spring:
  application:
    name: taskmanager

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  jackson:
    serialization:
      indent_output: true

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET_KEY}
  expiration: 86400000
